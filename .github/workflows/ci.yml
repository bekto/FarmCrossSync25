name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Runs the documented verification for both projects. Keep the commands in sync
# with the root README.md and each project's own README.
jobs:
  backend:
    name: Backend — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FarmCrossSync25-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FarmCrossSync25-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop-web:
    name: Desktop — svelte-check + unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FarmCrossSync25-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FarmCrossSync25-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --test src/lib/*.test.ts
      - run: npm run build

  desktop-rust:
    name: Desktop — clippy + cargo tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FarmCrossSync25-app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
